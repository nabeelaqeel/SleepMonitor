# Sleep Monitor — AWS deployment broker config (author-side runbook, notes/)
#
# LOCKED MODE: both listeners require credentials from mosquitto/passwd.
# Create the passwd file BEFORE the broker's first start, from the repo
# root on the server. The password is generated at deploy time (see the
# author-side deployment runbook) and lives only in the server's
# .env.development — never committed; rotate via the runbook's rotation
# procedure:
#
#   MQPW="$(grep '^MQTT_PASSWORD=' .env.development | cut -d= -f2-)"
#   docker run --rm -v "$PWD/mosquitto:/mosquitto/config" eclipse-mosquitto:2.1.2-alpine \
#     mosquitto_passwd -c -b /mosquitto/config/passwd sm "$MQPW"
#   sudo chown 1883:1883 mosquitto/passwd && sudo chmod 600 mosquitto/passwd
#
# (laptop dev keeps the NATIVE broker anonymous — this file is not used there)

# TCP listener — publisher / ingest / echo over localhost:1883
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

# WebSocket listener — the phone app (Paho JS), reached via the SG
listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd

# reap abandoned persistent sessions; queued QoS 1/2 stay alive meanwhile
persistent_client_expiration 2h

# persist queues + session state across broker restarts (mosquitto_data volume)
persistence true
persistence_location /mosquitto/data/

log_dest stdout
