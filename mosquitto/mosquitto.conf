# =============================================================
# Mosquitto Configuration — Sleep Monitor
# Supports plain TCP (1883) for Python publisher
# and WebSocket (9001) for the React Native Paho JS client.
# In production: Nginx terminates TLS on 443 and proxies to 9001.
# =============================================================

# ── Logging ───────────────────────────────────────────────────
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ── Persistence ───────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# ── Listener 1: Plain MQTT over TCP ───────────────────────────
# Used by the Python publisher (same host or internal network).
listener 1883
protocol mqtt

# ── Listener 2: MQTT over WebSocket ───────────────────────────
# Used by the React Native Paho JS client.
# In production, bind to localhost only — Nginx proxies port 443 to here.
listener 9001
protocol websockets

# ── Authentication ────────────────────────────────────────────
# passwd file is mounted at runtime via Docker volume.
# Run `make mqtt-passwd` to generate it (see Makefile).
allow_anonymous false
password_file /mosquitto/config/passwd

# ── Connection limits ─────────────────────────────────────────
max_connections 100
max_inflight_messages 20
max_queued_messages 200
message_size_limit 65536
