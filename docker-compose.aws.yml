# =============================================================
# Sleep Monitor — AWS Learner Lab stack (Postgres + Mosquitto)
#
# The Python services (api, ingest, publisher, echo) run in a host
# venv, so Postgres is exposed on 127.0.0.1:5432 only and the broker
# on :1883. The phone reaches the broker over WebSocket :9001 via the
# security group — open 1883 + 9001, never 5432.
#
# The broker starts LOCKED (allow_anonymous false): the passwd file
# must exist BEFORE the first start (see docs/DEPLOYMENT.md §3.6):
#   docker run --rm -v "$PWD/mosquitto:/config" eclipse-mosquitto:2 \
#     mosquitto_passwd -c -b /config/passwd sm '<password>'
# The password lives in app/eas.json (EXPO_PUBLIC_MQTT_*) and this
# repo's .env.development (MQTT_*).
#
# Usage (from the repo root, after repo + .env.development exist):
#   docker compose -f docker-compose.aws.yml --env-file .env.development up -d
# =============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: sleep-postgres
    restart: unless-stopped
    ports:
      # Host venv services connect over localhost — never open in SG
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # SQL files here run alphabetically on first container start only.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-sleep_monitor}
      POSTGRES_USER:     ${POSTGRES_USER:-sleep_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.development}
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_USER:-sleep_user} -d ${POSTGRES_DB:-sleep_monitor}"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  broker:
    image: eclipse-mosquitto:2
    container_name: sleep-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      # Whole dir, read-write: mosquitto_passwd writes ./mosquitto/passwd
      # from inside the container and changes must survive recreates.
      - ./mosquitto:/mosquitto/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  mosquitto_data:
    driver: local
