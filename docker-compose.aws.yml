# =============================================================
# Sleep Monitor — AWS stack: broker + TEST Postgres + ALL services
# (one compose, one command deploys/updates:
#   docker compose -f docker-compose.aws.yml --env-file .env.development up -d --build
#
# TWO DATABASE MODES — one active DATABASE_URL line in .env.development:
#   TEST (dev): the `postgres` service on the compose network — reached at
#               host name `postgres` (NOT localhost: containers have their
#               own network). Zero RDS cost. Schema auto-applies on a fresh
#               volume (postgres/init).
#   DEMO (eval): AWS RDS created+deleted per session (DEPLOYMENT_NOTES §3);
#               same compose, DATABASE_URL points at the RDS endpoint over TLS.
#
# Broker always starts; Postgres only with --profile local-db.
# api/ingest/publisher/echo subscribe to MQTT — placed after broker so the
# broker starts first; the broker restart policy covers late re-attempts.

# Broker LOCKED mode: passwd file must exist BEFORE first start (§2.9):
#   MQPW="$(grep '^MQTT_PASSWORD=' .env.development | cut -d= -f2-)"
#   docker run --rm -v "$PWD/mosquitto:/mosquitto/config" eclipse-mosquitto:2.1.2-alpine \
#     mosquitto_passwd -c -b /mosquitto/config/passwd sm "$MQPW"
#   sudo chown 1883:1883 mosquitto/passwd && sudo chmod 600 mosquitto/passwd
#
# Usage (--env-file REQUIRED on every compose call — profile-gated services
#        still get interpolated, and compose only auto-loads `.env`):
#   docker compose -f docker-compose.aws.yml --env-file .env.development --profile local-db up -d --build  # TEST: everything
#   docker compose -f docker-compose.aws.yml --env-file .env.development up -d --build                    # DEMO: broker + services (DB = RDS)
#
# Mode flip TEST → DEMO (and back): edit the ACTIVE DATABASE_URL line in
# .env.development, then `up -d` again — compose recreates only the
# containers whose env changed (api + ingest).
# =============================================================

x-python-common: &python-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file: .env.development
  depends_on:
    - broker
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  broker:
    # Pinned: the :2 tag floated Debian↔Alpine mid-deployment (2026-11-06 it
    # flipped to the 2.1.2-alpine build). 2.0.x builds cannot even parse this
    # conf (duplicate per-listener password_file) — a future drift must not
    # resurrect that race; bump the pin deliberately with mosquitto releases.
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: sleep-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      # Whole dir, read-write: mosquitto_passwd writes ./mosquitto/passwd
      # from inside the container and changes must survive recreates.
      - ./mosquitto:/mosquitto/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    profiles: [local-db]
    image: postgres:16-alpine
    container_name: sleep-postgres
    restart: unless-stopped
    # host-only bind: python services reach it over the compose network as
    # host name `postgres` — 5432 never appears in the security group.
    # psql on the host connects via the published 127.0.0.1:5432 (§3.3/§6.2b).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # SQL files here run alphabetically on first container start only.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-sleep_monitor}
      POSTGRES_USER:     ${POSTGRES_USER:-sleep_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?TEST mode needs POSTGRES_PASSWORD in .env.development}
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_USER:-sleep_user} -d ${POSTGRES_DB:-sleep_monitor}"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    <<: *python-common
    container_name: sleep-api
    ports:
      - "8000:8000"
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  ingest:
    <<: *python-common
    container_name: sleep-ingest
    command: ["python", "ingest/worker.py"]

  publisher:
    <<: *python-common
    container_name: sleep-publisher
    command: ["python", "publisher/publisher.py"]

  echo:
    <<: *python-common
    container_name: sleep-echo
    command: ["python", "publisher/echo.py"]

  # ── AI recommendation DEMO service ──
  # Demo mode is OFF by default: this service only starts when the compose
  # command carries --profile ai-demo. It loops a synthetic night through the
  # real trained model and publishes the band to sleep/recommendation every
  # AI_DEMO_INTERVAL seconds (rotate cycles healthy → monitor → apnea).
  #
  # ON:   docker compose -f docker-compose.aws.yml --env-file .env.development \
  #         --profile ai-demo up -d --build
  #       (script form: ./deploy/deploy-update.sh --ai-demo — appends the
  #       profile to the mode's profile and verifies sleep-ai-demo after)
  # OFF:  same command without the flag, then up -d — compose removes only
  #       this container.
  #
  # AI_DEMO_PATIENT_ID must equal the patientId of the app account you log
  # into during the demo (the app keys recommendations by that field).
  ai-demo:
    profiles: [ai-demo]
    <<: *python-common
    container_name: sleep-ai-demo
    environment:
      MQTT_HOST: broker
      MQTT_PORT: "1883"
    command:
      ["python", "-m", "ai.demo", "--publish-loop", "--scenario", "rotate",
       "--interval", "${AI_DEMO_INTERVAL:-60}", "--retain",
       "--patient-id", "${AI_DEMO_PATIENT_ID:-demo-patient}"]

volumes:
  mosquitto_data:
    driver: local
  postgres_data:
    driver: local
