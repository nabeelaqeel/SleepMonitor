# =============================================================
# Sleep Monitor — AWS stack (broker always; local Postgres = TEST mode)
#
# TWO DATABASE MODES — pick one line in .env.development (DEPLOYMENT.md §2.7):
#
#   TEST (default for a non-demo session)
#     docker compose -f docker-compose.aws.yml --profile local-db up -d
#     → Postgres container on this host, reachable ONLY from localhost:5432
#     → zero RDS cost; schema auto-applies on the fresh volume (postgres/init)
#
#   DEMO (evaluation days)
#     AWS RDS created + deleted per session (§2.5/§5); the host Psql client
#     connects over TLS (?sslmode=require); no container involved.
#
# Broker always starts; Postgres only with --profile local-db.
#
# Broker LOCKED mode: the passwd file must exist BEFORE first start (§2.9):
#   MQPW="$(grep '^MQTT_PASSWORD=' .env.development | cut -d= -f2-)"
#   docker run --rm -v "$PWD/mosquitto:/mosquitto/config" eclipse-mosquitto:2 \
#     mosquitto_passwd -c -b /mosquitto/config/passwd sm "$MQPW"
#   sudo chown 1883:1883 mosquitto/passwd && sudo chmod 600 mosquitto/passwd
#
# Usage:
#   docker compose -f docker-compose.aws.yml --env-file .env.development up -d                     # broker only
#   docker compose -f docker-compose.aws.yml --env-file .env.development --profile local-db up -d  # broker + test DB
# (--env-file is required on EVERY compose call: even profile-gated services
#  get interpolated, and compose only auto-loads `.env`, not our `.env.development`)
# =============================================================

services:
  broker:
    image: eclipse-mosquitto:2
    container_name: sleep-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      # Whole dir, read-write: mosquitto_passwd writes ./mosquitto/passwd
      # from inside the container and changes must survive recreates.
      - ./mosquitto:/mosquitto/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    profiles: [local-db]
    image: postgres:16-alpine
    container_name: sleep-postgres
    restart: unless-stopped
    ports:
      # host-only bind: the venv services connect from the host itself —
      # 5432 never appears in the security group, in either mode.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # SQL files here run alphabetically on first container start only.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-sleep_monitor}
      POSTGRES_USER:     ${POSTGRES_USER:-sleep_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?TEST mode needs POSTGRES_PASSWORD in .env.development}
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_USER:-sleep_user} -d ${POSTGRES_DB:-sleep_monitor}"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mosquitto_data:
    driver: local
  postgres_data:
    driver: local
