# =============================================================
# Sleep Monitor — AWS Learner Lab stack (Mosquitto broker only)
#
# The database is AWS RDS (per-session lifecycle, docs/DEPLOYMENT.md §2.3):
# master user sleep_user, database sleep_monitor, TLS via DATABASE_URL
# ?sslmode=require in the server's .env.development. Host-only Postgres in
# Docker would still be the laptop-dev path (docker-compose.yml).
# The broker is the only container here: phone via WebSocket :9001,
# publisher-side via TCP :1883. 5432 never appears in the EC2 SG — it lives
# in the RDS security group, sourced from the EC2's sg (§2.3).
#
# The broker starts LOCKED (allow_anonymous false): the passwd file must
# exist BEFORE the first start (see docs/DEPLOYMENT.md §2.6):
#   MQPW="$(grep '^MQTT_PASSWORD=' .env.development | cut -d= -f2-)"
#   docker run --rm -v "$PWD/mosquitto:/mosquitto/config" eclipse-mosquitto:2 \
#     mosquitto_passwd -c -b /mosquitto/config/passwd sm "$MQPW"
#   sudo chown 1883:1883 mosquitto/passwd && sudo chmod 600 mosquitto/passwd
#
# Usage (from the repo root, after repo + .env.development exist):
#   docker compose -f docker-compose.aws.yml up -d
# =============================================================

services:
  broker:
    image: eclipse-mosquitto:2
    container_name: sleep-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      # Whole dir, read-write: mosquitto_passwd writes ./mosquitto/passwd
      # from inside the container and changes must survive recreates.
      - ./mosquitto:/mosquitto/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mosquitto_data:
    driver: local
